name: Playlist automatisch aktualisieren
on:
  push:
    branches: [main]
    paths:
      - 'audio/**'
      - 'generate_playlist.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Metadaten-Bibliothek installieren
        run: python -m pip install mutagen==1.47.0
      - name: Playlist erzeugen
        run: python generate_playlist.py
      - name: Playlist speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.json
          if ! git diff --cached --quiet; then
            git commit -m "Playlist aktualisieren"
            git push
          fi
