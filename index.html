<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08172d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="wir"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="stylesheet" href="style.css?v=0043"><title>wir · Musik</title>  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head><body><main class="app"><header><button class="brand home-refresh" id="home-brand" type="button" title="Musik aktualisieren" aria-label="Zur Startansicht und Musik aktualisieren">wir<span class="brand-dot">.</span></button><button class="tagline home-refresh" id="home-tagline" type="button" title="Musik aktualisieren" aria-label="Zur Startansicht und Musik aktualisieren">UNSERE MUSIK</button></header><div id="pull-indicator" class="pull-indicator" aria-live="polite">↓ Zum Aktualisieren ziehen</div><section class="now"><h1 id="title">Noch keine Musik</h1><div class="cover" id="cover"><img src="icons/icon-512.png" alt="Musiknote aus Licht"></div></section><section class="controls"><div class="seek-row"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Abspielposition"><span id="duration">0:00</span></div><div class="transport"><button id="previous" type="button" title="Vorheriger Titel" aria-label="Vorheriger Titel"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 5h2v14H5zm3 7 11-7v14z"/></svg></button><button id="play" type="button" class="primary" title="Abspielen oder pausieren" aria-label="Abspielen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></button><button id="stop" type="button" title="Stoppen und zum Anfang" aria-label="Stoppen und zum Anfang"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.6" fill="currentColor"/></svg></button><button id="next" type="button" title="Nächster Titel" aria-label="Nächster Titel"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 5v14l11-7zm12 0h2v14h-2z"/></svg></button></div></section><section class="playlist-shell open" id="playlist-shell"><button id="toggle-list" class="list-toggle" aria-expanded="true"><span>♫ &nbsp; Playlist <b id="count">(0)</b></span><span id="chevron">⌄</span></button><div class="playlist-body" id="pl
